<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin · MyVideoPlayer</title>
  <!-- Root-absolute paths: this page is served at both /admin and /admin/ -->
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <header class="site-header admin-header">
    <a class="logo" href="/">MyVideoPlayer</a>
    <div class="admin-actions">
      <a href="/">View site</a>
      <button class="link-button" id="sign-out" type="button" hidden>Sign out</button>
    </div>
  </header>

  <main class="admin-main">
    <p class="admin-status" id="checking">Checking sign-in…</p>

    <!-- Signed out -->
    <section class="admin-panel sign-in-panel" id="sign-in" aria-labelledby="sign-in-heading" hidden>
      <h1 id="sign-in-heading">Admin sign in</h1>

      <form id="sign-in-form" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <p class="form-error" id="sign-in-error" role="alert" hidden></p>

        <button class="primary-button" id="sign-in-button" type="submit">Sign in</button>
      </form>
    </section>

    <!-- Signed in as admin -->
    <section class="admin-panel dashboard" id="dashboard" aria-labelledby="dashboard-heading" hidden>
      <div class="dashboard-heading">
        <h1 id="dashboard-heading">Videos</h1>
        <p class="signed-in-as">Signed in as <strong id="admin-email"></strong></p>
      </div>

      <div class="dashboard-toolbar">
        <button class="primary-button" id="add-video-button" type="button" aria-expanded="false" aria-controls="upload-panel">Add video</button>
        <p class="dashboard-message" id="dashboard-message" role="status"></p>
      </div>

      <!-- Add a video (admin/upload.js) -->
      <section class="upload-panel" id="upload-panel" aria-labelledby="upload-heading" hidden>
        <h2 id="upload-heading">Add a video</h2>

        <form id="upload-form" novalidate>
          <div class="field">
            <label for="video-file">Video file</label>
            <div class="drop-zone" id="video-drop-zone">
              <p class="drop-zone-text" id="video-file-hint"><strong>Drag a video file here</strong>, or choose one. MP4, up to 50 MB.</p>
              <input id="video-file" type="file" accept="video/mp4,.mp4" aria-describedby="video-file-hint video-file-note">
            </div>
            <p class="field-note" id="video-file-note" hidden></p>
          </div>

          <div class="frame-picker" id="frame-picker" hidden>
            <video class="frame-preview" id="frame-preview" muted playsinline preload="auto"></video>

            <div class="field">
              <label for="frame-slider">Thumbnail frame <span class="frame-time" id="frame-time">0.0 s</span></label>
              <input id="frame-slider" type="range" min="0" max="0" step="0.1" value="0">
            </div>

            <div class="thumb-choice">
              <figure class="thumb-figure">
                <img id="thumb-preview" alt="Thumbnail preview" width="143" height="105">
                <figcaption id="thumb-source">From the video frame</figcaption>
              </figure>

              <div class="field">
                <label for="custom-thumb">Or use your own thumbnail image</label>
                <p class="field-hint" id="custom-thumb-hint">PNG, JPG or WebP. Cropped to fit 143&times;105.</p>
                <input id="custom-thumb" type="file" accept="image/png,image/jpeg,image/webp" aria-describedby="custom-thumb-hint">
                <button class="link-button" id="clear-custom-thumb" type="button" hidden>Use the video frame instead</button>
              </div>
            </div>
          </div>

          <div class="field">
            <label for="video-title-input">Title</label>
            <input id="video-title-input" type="text" maxlength="100" required>
          </div>

          <div class="field">
            <label for="video-description-input">Description <span class="optional">(optional)</span></label>
            <textarea id="video-description-input" rows="3" maxlength="500" aria-describedby="description-count"></textarea>
            <p class="field-hint" id="description-count">0 / 500</p>
          </div>

          <label class="checkbox">
            <input id="video-published" type="checkbox" checked>
            Published (visible on the site)
          </label>

          <p class="form-error" id="upload-error" role="alert" hidden></p>
          <p class="upload-progress" id="upload-progress" role="status"></p>

          <div class="form-buttons">
            <button class="primary-button" id="upload-button" type="submit">Upload</button>
            <button class="secondary-button" id="cancel-upload" type="button">Cancel</button>
          </div>
        </form>
      </section>

      <p class="admin-status" id="videos-status" role="status"></p>
      <ol class="video-list" id="video-list"></ol>
    </section>
  </main>

  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
