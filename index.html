<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyVideoPlayer</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#hero-video">Skip to video player</a>

  <header class="site-header">
    <a class="logo" href="#">MyVideoPlayer</a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
      <span class="menu-icon" aria-hidden="true"></span>
    </button>
    <nav class="site-nav" id="site-nav" aria-label="Main">
      <a href="#">About</a>
      <a href="#">Events</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main class="player">
    <h1 class="visually-hidden">Video portfolio</h1>

    <!-- src, poster and the gallery are filled in by js/main.js from Supabase -->
    <video class="hero-video" id="hero-video"
           aria-label="Video player"
           width="1472" height="1080"
           controls muted playsinline preload="auto"></video>

    <section class="video-info" aria-label="About this video">
      <h2 class="video-title" id="video-title"></h2>
      <p class="video-description" id="video-description" hidden></p>
    </section>

    <p class="visually-hidden" id="now-playing" aria-live="polite"></p>

    <!-- One scrolling row; the arrows and edge fades appear only when it overflows -->
    <div class="gallery-strip">
      <button class="gallery-arrow gallery-prev" type="button" aria-label="Previous videos" aria-controls="gallery" hidden>&lsaquo;</button>
      <ul class="gallery" id="gallery" aria-label="Choose a video"></ul>
      <button class="gallery-arrow gallery-next" type="button" aria-label="More videos" aria-controls="gallery" hidden>&rsaquo;</button>
    </div>

    <noscript><p class="video-info">Turn on JavaScript to watch the videos.</p></noscript>
  </main>

  <footer class="site-footer">
    <p>My Contact Information &ndash; My Social Media Links</p>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
